name: Build

# 在 Windows 上编译验证整个项目（VB.NET + WPF + .NET Framework 4.8）。
# WPF 仅支持 Windows，本工作流用于解决在 macOS 上无法本地编译验证的问题：
# 每次推送或 PR 都会自动编译，可从 Artifact 下载可运行的 PCL2。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 编译（${{ matrix.configuration }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Release 为发布配置；Snapshot 为快照配置（两者仅编译常量不同）
        configuration: [Release, Snapshot]
    steps:
      - name: 检出代码（含 MeloongCore 子模块）
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 定位 MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: 还原 NuGet 包
        shell: pwsh
        run: dotnet restore PCLCS\PCLCS.csproj

      - name: 编译
        shell: pwsh
        run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }} -m -verbosity:minimal

      - name: 检查编译产物
        shell: pwsh
        run: |
          $exe = "Plain Craft Launcher 2\bin\Plain Craft Launcher 2.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "未找到编译产物：$exe"
            exit 1
          }
          Write-Host "编译成功：$exe"
          Get-ChildItem "Plain Craft Launcher 2\bin" | Select-Object Name, Length | Format-Table -AutoSize

      - name: 上传编译产物
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: PCL2-Release
          path: Plain Craft Launcher 2\bin
          if-no-files-found: error
