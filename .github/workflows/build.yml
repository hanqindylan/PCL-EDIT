name: Build

# 在 Windows 上编译验证整个项目（VB.NET + WPF + .NET Framework 4.8）。
# WPF 仅支持 Windows，本工作流用于解决在 macOS 上无法本地编译验证的问题：
# 每次推送或 PR 都会自动编译，可从 Artifact 下载可运行的 PCL2。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 编译（${{ matrix.configuration }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Release 为发布配置；Snapshot 为快照配置（两者仅编译常量不同）
        configuration: [Release, Snapshot]
    steps:
      - name: 检出代码（含 MeloongCore 子模块）
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 定位 MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: 还原 NuGet 包
        shell: pwsh
        run: dotnet restore PCLCS\PCLCS.csproj

      # 旧式 VB 工程不会自动编译它引用的 SDK 式 C# 工程，必须先把 C# 工程编译出 DLL，
      # 否则 VB 编译时找不到 PCLCS / MeloongCore 的引用程序集
      - name: 编译 C# 工程
        shell: pwsh
        run: |
          dotnet build PCLCS\PCLCS.csproj -c ${{ matrix.configuration }} -v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 编译
        id: build_vb
        shell: pwsh
        run: |
          $log = "${{ runner.temp }}\msbuild.log"
          msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" `
            -p:Configuration=${{ matrix.configuration }} -m -verbosity:normal `
            "-fileLogger" "-fileLoggerParameters:LogFile=$log;Verbosity=normal;Encoding=UTF-8"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # 以 ::error:: 形式输出，失败原因会直接显示在 Actions 摘要里
            Select-String -Path $log -Pattern ": error |: fatal error " |
              Select-Object -First 20 | ForEach-Object {
                $line = $_.Line -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
                Write-Host "::error::$line"
              }
          }
          exit $code

      - name: 检查编译产物
        shell: pwsh
        run: |
          Get-ChildItem "Plain Craft Launcher 2\bin" -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table -AutoSize
          $exe = "Plain Craft Launcher 2\bin\Plain Craft Launcher 2.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "未找到编译产物：$exe"
            exit 1
          }
          Write-Host "编译成功：$exe"

      - name: 上传编译产物
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: PCL2-Release
          path: Plain Craft Launcher 2\bin
          if-no-files-found: error

  # 用编译好的 Release 产物打出自包含的中文安装程序（不需要选语言，双击即装）
  installer:
    name: 打包安装程序
    needs: build
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 下载 Release 产物
        uses: actions/download-artifact@v6
        with:
          name: PCL2-Release
          path: payload

      - name: 打包安装包内容
        shell: pwsh
        run: |
          # 把 PCL 的 bin 内容压进 payload.zip，供安装器内嵌
          New-Item -ItemType Directory -Force -Path "PCLInstaller\Payload" | Out-Null
          Compress-Archive -Path "payload\*" -DestinationPath "PCLInstaller\Payload\payload.zip" -CompressionLevel Optimal
          Get-Item "PCLInstaller\Payload\payload.zip" | Select-Object Name, Length | Format-Table -AutoSize

      - name: 编译安装程序
        shell: pwsh
        run: |
          $log = "${{ runner.temp }}\installer.log"
          dotnet build "PCLInstaller\PCLInstaller.csproj" -c Release -v:normal `
            "-filelogger" "-fileloggerparameters:LogFile=$log;Verbosity=normal;Encoding=UTF-8"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path $log -Pattern ": error |: fatal error " |
              Select-Object -First 20 | ForEach-Object {
                $line = $_.Line -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
                Write-Host "::error::$line"
              }
          }
          exit $code

      - name: 检查安装程序
        shell: pwsh
        run: |
          $exe = Get-ChildItem "PCLInstaller\bin" -Filter "*.exe" -Recurse |
                   Where-Object { $_.Name -like "*安装程序*" } | Select-Object -First 1
          if (-not $exe) { Write-Error "未找到安装程序 exe"; exit 1 }
          Write-Host "安装程序：$($exe.FullName)"
          Write-Host ("大小：{0:N2} MB" -f ($exe.Length / 1MB))
          if ($exe.Length -lt 1MB) { Write-Error "安装程序体积异常，内嵌内容可能未打包"; exit 1 }
          # 统一改名为便于识别的发布文件名
          $out = Join-Path "${{ runner.temp }}" "PCL-EDIT-3.0.0-安装程序.exe"
          Copy-Item $exe.FullName $out
          echo "setup_path=$out" >> $env:GITHUB_OUTPUT
        id: setup

      - name: 上传安装程序
        uses: actions/upload-artifact@v7
        with:
          name: PCL-EDIT-安装程序
          path: ${{ runner.temp }}/PCL-EDIT-3.0.0-安装程序.exe
          if-no-files-found: error
