name: Build

# 在 Windows 上编译验证整个项目（VB.NET + WPF + .NET Framework 4.8）。
# WPF 仅支持 Windows，本工作流用于解决在 macOS 上无法本地编译验证的问题：
# 每次推送或 PR 都会自动编译，可从 Artifact 下载可运行的 PCL2。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: 编译（${{ matrix.configuration }}）
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Release 为发布配置；Snapshot 为快照配置（两者仅编译常量不同）
        configuration: [Release, Snapshot]
    steps:
      - name: 检出代码（含 MeloongCore 子模块）
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: 定位 MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: 还原 NuGet 包
        shell: pwsh
        run: dotnet restore PCLCS\PCLCS.csproj

      # 旧式 VB 工程不会自动编译它引用的 SDK 式 C# 工程，必须先把 C# 工程编译出 DLL，
      # 否则 VB 编译时找不到 PCLCS / MeloongCore 的引用程序集
      - name: 编译 C# 工程
        shell: pwsh
        run: |
          dotnet build PCLCS\PCLCS.csproj -c ${{ matrix.configuration }} -v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 编译
        shell: pwsh
        run: |
          $log = "${{ runner.temp }}\msbuild.log"
          msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" `
            -p:Configuration=${{ matrix.configuration }} -m -verbosity:normal `
            "-fileLogger" "-fileLoggerParameters:LogFile=$log;Verbosity=normal;Encoding=UTF-8"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $errors = Select-String -Path $log -Pattern ": error |: fatal error " | Select-Object -First 20
            foreach ($e in $errors) {
              # 以 ::error:: 形式输出，失败原因会直接显示在 Actions 摘要里
              $line = $e.Line -replace "%", "%25" -replace "`r", "" -replace "`n", "%0A"
              Write-Host "::error::$line"
            }
            Write-Host "===== 错误明细 ====="
            Select-String -Path $log -Pattern ": error |: fatal error " | Select-Object -First 60 | ForEach-Object { Write-Host $_.Line }
            Write-Host "===== 尾部日志 ====="
            Get-Content $log -Tail 40
          }
          exit $code

      - name: 检查编译产物
        shell: pwsh
        run: |
          Get-ChildItem "Plain Craft Launcher 2\bin" -ErrorAction SilentlyContinue | Select-Object Name, Length | Format-Table -AutoSize
          $exe = "Plain Craft Launcher 2\bin\Plain Craft Launcher 2.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "未找到编译产物：$exe"
            exit 1
          }
          Write-Host "编译成功：$exe"

      - name: 上传编译产物
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: PCL2-Release
          path: Plain Craft Launcher 2\bin
          if-no-files-found: error
